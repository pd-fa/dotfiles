# AeroSpace — i3-like tiling WM. Replaces native Spaces and the BetterTouchTool
# gesture bindings. See docs/MACOS_INPUT.md.
#
# Read natively from ~/.config/aerospace, so this file needs no bootstrap symlink.

config-version = 2

start-at-login = true
auto-reload-config = true

# 'workspace next|prev' walks every workspace on the monitor in alphabetical
# order, including empty ones. The mouse thumb buttons drive exactly that, so
# the upstream default of 31 persistent workspaces (1-9, A-Z) would mean 31
# clicks to wrap. Five is the whole point of keeping this list short.
persistent-workspaces = ["1", "2", "3", "4", "5"]

gaps.inner.horizontal = 6
gaps.inner.vertical = 6
gaps.outer.top = 6
gaps.outer.bottom = 6
gaps.outer.left = 6
gaps.outer.right = 6

[mode.main.binding]

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# --no-outer-gaps because the 6px border is chrome for tiled windows; keeping
# it around a window explicitly asked to fill the screen defeats the request.
alt-f = 'fullscreen --no-outer-gaps'

# System Settings, 1Password's mini window and video calls are sized by their
# own authors and stretch badly into a tile. Toggles back into the tree.
alt-shift-space = 'layout floating tiling'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# Keyboard equivalents of the mouse thumb buttons, which Karabiner maps to the
# same two commands.
alt-leftSquareBracket = 'workspace --wrap-around prev'
alt-rightSquareBracket = 'workspace --wrap-around next'
alt-tab = 'workspace-back-and-forth'
