"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$nodejs$python$golang$rust\
$cmd_duration\
$line_break\
$character"""

add_newline = true

# Must sit above [palettes.tokyonight]: a bare key after a table header belongs
# to that table, so declaring it below defines palettes.tokyonight.palette and
# leaves the palette inactive — built-in names fall back to basic ANSI and the
# rest emit no colour at all.
palette = "tokyonight"

[palettes.tokyonight]
blue = "#8ce6ff"
cyan = "#4bb8d9"
fg = "#e9e2f8"
green = "#a6dd70"
orange = "#ffab77"
pink = "#ff7ab8"
purple = "#c9aefc"
red = "#ff8fa3"
grey = "#9c8cc4"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " \U000F033E"

[git_branch]
symbol = "\uF418 "
style = "purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "orange"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\uF01C "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Cluster context matters more than gcloud project for day-to-day GKE work
[kubernetes]
disabled = false
symbol = "\U000F10FE "
style = "cyan"
format = '[$symbol$context( \($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = "gke_(?P<project>[\\w-]+)_(?P<zone>[\\w-]+)_(?P<cluster>[\\w-]+)"
context_alias = "$cluster"

[nodejs]
symbol = "\uE718 "
style = "green"
format = "[$symbol($version)]($style) "

[python]
symbol = "\uE235 "
style = "green"
format = "[$symbol($version)]($style) "

[golang]
symbol = "\uE627 "
style = "cyan"
format = "[$symbol($version)]($style) "

[rust]
symbol = "\U000F1617 "
style = "orange"
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 2000
style = "grey"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](orange)"

# Noise — cluster context already tells you the project
[gcloud]
disabled = true

[aws]
disabled = true
