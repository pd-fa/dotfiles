# Canonical colour source for every terminal application in this repo.
#
# Retheme by editing [slots] only. Keys are ROLES, never colour names — a slot
# called "accent" survives a move from pink to violet; one called "pink" does
# not, and the coupling reappears in every consumer.
#
# Semantic slots (ok/warn/err/info) stay legible on purpose. btop's temperature
# gradient, lazygit's diffs and atuin's alerts encode meaning in hue; recolour
# those to match the chrome and the signal is gone.

schemaVersion = 1
name = "pinknight"

[slots]
# Surfaces — dark violet, darkest first
bg            = "#16111f"
bg_dark       = "#100c17"
bg_highlight  = "#221a33"
bg_selection  = "#2f2348"
bar           = "#1e1730"
panel         = "#2b2145"

# Text
fg            = "#ffd6ec"
fg_dim        = "#c99ab4"
muted         = "#8a7a9e"
ink           = "#1a0f18"

# Chrome accents — the pink identity
accent        = "#ff4fa3"
accent_bright = "#ff7ab8"
accent_deep   = "#c93d80"
purple        = "#bb9af7"
purple_deep   = "#9d7cd8"

# Semantic — hue carries meaning, retune with care
ok            = "#9ece6a"
warn          = "#e0af68"
err           = "#f7768e"
err_bright    = "#db4b4b"
info          = "#7dcfff"
info_deep     = "#27a1b9"
info_light    = "#89ddff"
teal          = "#73daca"
special       = "#ff9e64"

# Pairs asserted on every render. Rendering aborts below the floor, so a
# retune can never silently ship unreadable chrome.
[[contrast]]
fg = "fg"
bg = "bar"
min = 4.5
[[contrast]]
fg = "fg_dim"
bg = "bar"
min = 4.5
[[contrast]]
fg = "ink"
bg = "accent"
min = 4.5
[[contrast]]
fg = "fg"
bg = "panel"
min = 4.5
[[contrast]]
fg = "fg"
bg = "bg"
min = 7.0
[[contrast]]
fg = "muted"
bg = "bg"
min = 3.0

# Upstream Tokyo Night hex -> slot. Vendored theme files are rewritten through
# this map, so adopting a new upstream theme means extending this table rather
# than hand-editing eleven config files.
